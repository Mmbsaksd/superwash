version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: superwash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superwash_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superwash_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-superwash_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superwash_user} -d ${POSTGRES_DB:-superwash_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superwash_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-superwash_user}:${POSTGRES_PASSWORD:-superwash_secure_password}@db:5432/${POSTGRES_DB:-superwash_db}
      - SECRET_KEY=${SECRET_KEY:-superwash_prod_secret_must_be_set_in_env}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: superwash_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
